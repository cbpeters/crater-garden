<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crater Garden</title>
<meta name="description" content="A space-themed procedural WebGPU fly-through, inspired by Abyssal Garden. No images, models or sound files.">
<style>
  /* Palette: void, hull, nebula, saucer teal, parchment, star, beam yellow, rocket orange, rust */
  :root { --void:#0A1214; --hull:#163437; --nebula:#2A6E62; --saucer:#40A284; --parch:#EDDDC3; --star:#FBCC87; --beam:#FDE669; --rocket:#E0631E; --rust:#A13E13; }
  html, body { margin:0; height:100%; background:var(--void); overflow:hidden; color:var(--parch); font:500 16px/1.45 "Barlow","Helvetica Neue",Arial,sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .layer { position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:radial-gradient(ellipse at center, rgba(10,18,20,.35), rgba(10,18,20,.82)); z-index:2; }
  .layer[hidden] { display:none; }
  .card { max-width:560px; text-align:center; }
  .eyebrow { font:700 13px/1.2 "Barlow Condensed","Arial Narrow",sans-serif; letter-spacing:.22em; text-transform:uppercase; color:var(--beam); margin:0 0 8px; }
  h1 { margin:0; font:400 clamp(54px,11vw,104px)/.9 Anton,Impact,"Arial Narrow Bold",sans-serif; text-transform:uppercase; color:var(--star); text-shadow:4px 4px 0 var(--rust); }
  p { margin:14px auto 0; max-width:46ch; color:rgba(237,221,195,.92); }
  .keys { margin:18px auto 0; display:grid; grid-template-columns:auto auto; gap:4px 18px; justify-content:center; text-align:left; font-size:15px; color:rgba(237,221,195,.9); }
  .keys b { color:var(--beam); font-weight:700; letter-spacing:.06em; }
  button { margin-top:22px; font:700 20px/1 "Barlow Condensed","Arial Narrow",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--void); background:var(--beam); border:3px solid var(--void); border-radius:6px; padding:14px 28px; cursor:pointer; box-shadow:5px 5px 0 var(--rust); }
  button:active { transform:translate(3px,3px); box-shadow:2px 2px 0 var(--rust); }
  .note { font-size:13px; color:var(--saucer); margin-top:16px; }
  #hud { position:fixed; left:12px; bottom:10px; z-index:1; font:600 13px/1.4 ui-monospace,Menlo,monospace; color:var(--beam); text-shadow:0 1px 0 var(--void); white-space:pre; pointer-events:none; }
  #err { color:var(--star); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div class="layer" id="menu">
  <div class="card">
    <p class="eyebrow">A space-themed fly-through</p>
    <h1>Crater<br>Garden</h1>
    <p id="status">Growing the garden…</p>
    <div class="keys" id="keys" hidden>
      <b>Look</b><span>Mouse</span><b>Fly</b><span>W A S D</span><b>Up / down</b><span>E / Q</span><b>Faster</b><span>Hold Shift</span>
      <b>Viewpoints</b><span>1 to 5</span><b>Sound</b><span>M</span><b>Stats</b><span>H</span>
    </div>
    <button id="go" hidden>Launch</button>
    <p class="note">Everything here is made by code: no images, models or sound files. Esc opens this menu.</p>
    <p class="note" id="err"></p>
  </div>
</div>

<script type="module">
// ============================================================================
// Crater Garden: a procedural WebGPU fly-through in a 1950s pulp sci-fi look.
// One file, no dependencies, no assets.
// Inspired by: https://github.com/Noniv/abyssal-garden (MIT); this is a fresh, much smaller implementation of the same
// approach (terrain + instanced plants + instanced props + analytic sky + one post pass), re-themed.
// ============================================================================
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- tiny helpers (noise, rng)

  const t = (1 + sqrt(5)) / 2; let V = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map((p) => { const l = hypot(...p); return p.map((c) => c / l); });

}

  const at = (t, sx, sz) => [sx * (w0 + (w1 - w0) * t) / 2, t * h, sz * (d0 + (d1 - d0) * t) / 2];
  for (let i = 0; i < rows; i++) { const t0 = i / rows, t1 = (i + 1) / rows, tag = (i % 3 === 1 && i > 2) ? 2 : 0;
    quad(m, at(t0, -1, 1), at(t0, 1, 1), at(t1, 1, 1), at(t1, -1, 1), tag); quad(m, at(t0, 1, -1), at(t0, -1, -1), at(t1, -1, -1), at(t1, 1, -1), tag);
    quad(m, at(t0, 1, 1), at(t0, 1, -1), at(t1, 1, -1), at(t1, 1, 1), 1); quad(m, at(t0, -1, -1), at(t0, -1, 1), at(t1, -1, 1), at(t1, -1, -1), 1); }

}

  const prof = [[0, 7.4, 2], [0.45, 6.9, 2], [0.95, 5.9, 2], [1.25, 4.6, 0], [1.4, 3.2, 1], [1.4, 2.2, 0], [1.4, 1.2, 1], [1.4, 0.2, 0], [1.1, -0.5, 3], [0.7, -0.9, 3], [0, -0.9, 3]];

    tri(m, p(1.3, 3.0, 0), p(3.0, -0.6, 0), p(1.3, -0.4, 0), 3); tri(m, p(1.3, 3.0, 0.08), p(1.3, -0.4, 0.08), p(3.0, -0.6, 0.08), 3); } return m;

{ let n = 0; for (const k of MESH_ORDER) { MESH_AT[k] = [n, MESHES[k].v.length / 7]; n += MESHES[k].v.length / 7; } }

// ---------------------------------------------------------------- terrain grid

}
{ let k = 0; for (let j = 0; j < TN; j++) for (let i = 0; i < TN; i++) { const a = j * (TN + 1) + i, b = a + 1, c = a + TN + 1, d = c + 1; terrainI.set([a, c, b, b, c, d], k); k += 6; } }

// ---------------------------------------------------------------- scatter plants (glow stalks) and props
say('Growing the glow stalks…');
// set pieces (placed here so the plants can leave them room)
const MONO = [-58, 24], ROCKET = [32, -40];
const ARCHES = [[70, 62, 15, 0.6], [-34, -96, 12, 2.1], [96, -60, 17, 1.2], [-104, -22, 13, 0.2], [20, 118, 10, 1.7]];

const keys = {}; let menu = true, hud = false, pointer = false;
addEventListener('keydown', (e) => { keys[e.code] = true; if (e.repeat) return;
  if (e.code === 'KeyH') { hud = !hud; $('hud').textContent = ''; } else if (e.code === 'KeyM') mute(); else if (e.code === 'Escape') setMenu(true);
  else if (e.code >= 'Digit1' && e.code <= 'Digit5') POSES[e.code.charCodeAt(5) - 49](); sound(); });
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
let mdx = 0, mdy = 0;
addEventListener('mousemove', (e) => { if (document.pointerLockElement === canvas) { mdx += e.movementX; mdy += e.movementY; } });
const lock = () => { sound(); const p = canvas.requestPointerLock({ unadjustedMovement: true }); if (p && p.catch) p.catch(() => canvas.requestPointerLock()).catch(() => 0); };
canvas.addEventListener('click', () => { if (!menu) lock(); });
document.addEventListener('pointerlockchange', () => { pointer = !!document.pointerLockElement; if (!pointer && !menu && !params.has('pose')) setMenu(true); });
function setMenu(m) { menu = m; $('menu').hidden = !m; if (m && document.pointerLockElement) document.exitPointerLock(); }
$('go').onclick = () => { setMenu(false); $('go').textContent = 'Resume'; lock(); };

// ---------------------------------------------------------------- sound: a theremin drone and boops, all synthesized
let AC, OUT, muted = false;
function mkSound(ac) {
  const N = (C, o, ...to) => { const n = new C(ac, o); for (const d of to) n.connect(d); if (n.start) n.start(); return n; }, G = (gain, ...to) => N(GainNode, { gain }, ...to);
  const lim = N(DynamicsCompressorNode, { threshold: -8, ratio: 12 }, ac.destination); OUT = G(0, lim); OUT.gain.setTargetAtTime(0.6, ac.currentTime, 1);
  const lp = N(BiquadFilterNode, { type: 'lowpass', frequency: 420, Q: 0.7 }, OUT);
  for (const [f, v] of [[73.42, 0.16], [110, 0.1], [146.83, 0.06], [220.5, 0.035]]) { const gn = G(v, lp); N(OscillatorNode, { frequency: f }, gn); N(OscillatorNode, { frequency: f * 1.004 }, gn); }
  const lfo = N(OscillatorNode, { frequency: 0.07 }, G(180, lp.frequency));
  const voiceG = G(0, OUT), voice = N(OscillatorNode, { type: 'sine', frequency: 440 }, voiceG), vib = N(OscillatorNode, { frequency: 5.4 }, G(7, voice.frequency));
  const boopG = G(0, OUT), boop = N(OscillatorNode, { type: 'triangle', frequency: 800 }, boopG);
  const NOTES = [0, 2, 4, 7, 9, 12, 14, 16], A4 = 440; let tT = ac.currentTime + 4, tB = ac.currentTime + 2;
  return () => { const t = ac.currentTime + 0.05;
    if (t > tT) { const f = A4 * 2 ** (NOTES[Math.random() * NOTES.length | 0] / 12) / 2, d = 2.5 + Math.random() * 3; voice.frequency.cancelScheduledValues(t); voice.frequency.setTargetAtTime(f, t, 0.35);
      voiceG.gain.cancelScheduledValues(t); voiceG.gain.setValueAtTime(voiceG.gain.value, t); voiceG.gain.linearRampToValueAtTime(0.05, t + 0.7); voiceG.gain.setTargetAtTime(0, t + d * 0.6, 0.5); tT = t + d + 2 + Math.random() * 7; }
    if (t > tB) { const f = 700 + Math.random() * 900; boop.frequency.setValueAtTime(f, t); boop.frequency.exponentialRampToValueAtTime(f * 1.6, t + 0.09); boopG.gain.setValueAtTime(0, t); boopG.gain.linearRampToValueAtTime(0.05, t + 0.01); boopG.gain.setTargetAtTime(0, t + 0.02, 0.05); tB = t + 3 + Math.random() * 9; } };
}
function sound() { if (!AC) { try { AC = new AudioContext({ latencyHint: 'playback' }); setInterval(mkSound(AC), 100); } catch { return; } } if (AC.state === 'suspended' && !document.hidden) AC.resume(); }
const mute = () => { if (!AC) return; muted = !muted; OUT.gain.setTargetAtTime(muted ? 0 : 0.6, AC.currentTime, 0.08); };
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : AC.resume(); });

// ---------------------------------------------------------------- frame
const vp = new Float64Array(16), tmpP = new Float64Array(16), tmpV = new Float64Array(16);
function perspective(out, fovY, asp, n, f) { const k = 1 / Math.tan(fovY / 2); out.fill(0); out[0] = k / asp; out[5] = k; out[10] = f / (n - f); out[11] = -1; out[14] = f * n / (n - f); }
function mul(out, a, b) { for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; out[c * 4 + r] = s; } }
const FOV = 1.18; let last = 0, time = 0, frameNo = 0, ema = 16, cool = 0, hN = 0, hAcc = 0, hMax = 0, startT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtr = now - last; last = now; const dt = min(dtr / 1000, 0.1); time += dt; frameNo++;
  if (!startT) startT = now;
  if (menu) { // behind the menu: a slow orbit around the basin
    const a = time * 0.06 + 0.4; aimAt(cos(a) * 105, g(cos(a) * 105, sin(a) * 105) + 14, sin(a) * 105, 0, g(0, 0) + 10, 0);
  } else {
    const k = 1 - exp(-dt * 30); cam.yaw += mdx * 0.0022 * k * 2.2 * 0.45; cam.pitch -= mdy * 0.0022 * k * 2.2 * 0.45; mdx *= 1 - k * 0.55; mdy *= 1 - k * 0.55;
    cam.pitch = min(max(cam.pitch, -1.5), 1.5);
    const sp = keys.ShiftLeft || keys.ShiftRight ? 38 : 12, f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), up = (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0);
    const cp = cos(cam.pitch), sy = sin(cam.yaw), cy = cos(cam.yaw), fx = cp * sy, fy = sin(cam.pitch), fz = -cp * cy, ka = 1 - exp(-dt * 4.5);
    cam.vx += ((fx * f + cy * r) * sp - cam.vx) * ka; cam.vy += ((fy * f + up) * sp - cam.vy) * ka; cam.vz += ((fz * f + sy * r) * sp - cam.vz) * ka;
    cam.x += cam.vx * dt; cam.y += cam.vy * dt; cam.z += cam.vz * dt;
    const rad = hypot(cam.x, cam.z); if (rad > WORLD_R) { cam.x *= WORLD_R / rad; cam.z *= WORLD_R / rad; }
    const floorY = H(cam.x, cam.z) + 1.5; if (cam.y < floorY) { cam.y = floorY; if (cam.vy < 0) cam.vy = 0; } if (cam.y > 120) cam.y = 120;
  }
  // dynamic resolution: aim for ~60 fps on whatever this machine is
  ema += (dtr - ema) * 0.05; if (--cool < 0 && frameNo > 30) { if (ema > 18.5 && scale > 0.5) { scale = max(0.5, scale * 0.9); cool = 45; resize(); } else if (ema < 12.5 && scale < 1) { scale = min(1, scale * 1.06); cool = 120; resize(); } }
  const cp = cos(cam.pitch), sp2 = sin(cam.pitch), cyw = cos(cam.yaw), syw = sin(cam.yaw);
  const fx = cp * syw, fy = sp2, fz = -cp * cyw, rx = cyw, rz = syw, ux = -syw * sp2, uy = cp, uz = cyw * sp2;
  perspective(tmpP, FOV, W / H2, 0.15, 700);
  tmpV[0] = rx; tmpV[1] = ux; tmpV[2] = -fx; tmpV[3] = 0; tmpV[4] = 0; tmpV[5] = uy; tmpV[6] = -fy; tmpV[7] = 0; tmpV[8] = rz; tmpV[9] = uz; tmpV[10] = -fz; tmpV[11] = 0;
  tmpV[12] = -(rx * cam.x + rz * cam.z); tmpV[13] = -(ux * cam.x + uy * cam.y + uz * cam.z); tmpV[14] = fx * cam.x + fy * cam.y + fz * cam.z; tmpV[15] = 1;
  mul(vp, tmpP, tmpV); for (let i = 0; i < 16; i++) UF[i] = vp[i];
  const th = Math.tan(FOV / 2);
  UF.set([cam.x, cam.y, cam.z, time, rx, 0, rz, th * W / H2, ux, uy, uz, th, fx, fy, fz, 0, W, H2, 1, frameNo % 997], 16);
  Q.writeBuffer(ubo, 0, UF); animateProps(time);

  const e = device.createCommandEncoder(), tex = ctx.getCurrentTexture();
  let r = e.beginRenderPass(passScene);
  r.setPipeline(pSky); r.setBindGroup(0, bgSky); r.draw(3);
  r.setPipeline(pTer); r.setBindGroup(0, bgTer); r.setVertexBuffer(0, vbTerrain); r.setIndexBuffer(ibTerrain, 'uint32'); r.drawIndexed(terrainI.length);
  r.setPipeline(pStalk); r.setBindGroup(0, bgStalk); r.setVertexBuffer(0, stalkBuf); r.draw((SEG_N + 1) * 2, nStalk);
  r.setPipeline(pMesh); r.setBindGroup(0, bgMesh); r.setVertexBuffer(0, vbMesh); r.setVertexBuffer(1, instBuf);
  for (const d of draws) if (d.kind === 'solid' && d.count) r.draw(MESH_AT[d.mesh][1], d.count, MESH_AT[d.mesh][0], d.first);
  r.setPipeline(pBeam); r.setBindGroup(0, bgBeam); for (const d of draws) if (d.kind === 'beam' && d.count) r.draw(MESH_AT[d.mesh][1], d.count, MESH_AT[d.mesh][0], d.first);
  r.setPipeline(pSpore); r.setBindGroup(0, bgSpore); r.draw(4, 2600);
  r.end();
  passPost.colorAttachments[0].view = tex.createView();
  r = e.beginRenderPass(passPost); r.setPipeline(pPost); r.setBindGroup(0, bgPost); r.draw(3); r.end();
  Q.submit([e.finish()]);
  if (hud) { hN++; hAcc += dtr; if (dtr > hMax) hMax = dtr; if (hAcc > 500) { $('hud').textContent = `${(hN * 1000 / hAcc).toFixed(0)} fps · worst ${hMax.toFixed(1)} ms · ${W}x${H2} (${(scale * 100) | 0}%) · stalks ${nStalk} · tris ${triCount()}`; hN = 0; hAcc = 0; hMax = 0; } }
}
const SEG_N = 5;
const triCount = () => { let n = (terrainI.length / 3) + nStalk * SEG_N * 2; for (const d of draws) n += d.count * MESH_AT[d.mesh][1] / 3; return (n / 1e6).toFixed(2) + 'M'; };

// ---------------------------------------------------------------- go
$('status').textContent = 'Ready when you are.'; $('keys').hidden = false; $('go').hidden = false;
const pose = params.get('pose');
if (pose) { POSES[(+pose || 1) - 1](); setMenu(false); } else POSES[0]();
if (params.has('hud')) { hud = true; }
requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
</script>
